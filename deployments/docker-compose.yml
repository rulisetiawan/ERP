version: '3.8'

services:
  # 1. Nginx Reverse Proxy API Gateway Entrypoint
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-erp
      - auth-service
      - hr-payroll-service
      - inventory-service
      - pos-service
      - purchasing-service
      - finance-service
      - chat-service
      - crm-loyalty-service
      - ai-assistant-service
      - asset-service
    networks:
      - erp_network

  # 2. Next.js Web ERP Admin App
  web-erp:
    build:
      context: ..
      dockerfile: apps/web-erp/Dockerfile
    container_name: erp_web_erp
    restart: always
    ports:
      - "3001:3001"
    networks:
      - erp_network

  # 3. Go Microservices (10 Services)
  auth-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: auth-service
    container_name: erp_auth_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8001
    depends_on:
      - postgres
    networks:
      - erp_network

  hr-payroll-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: hr-payroll-service
    container_name: erp_hr_payroll_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8002
    depends_on:
      - postgres
    networks:
      - erp_network

  inventory-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: inventory-service
    container_name: erp_inventory_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8003
    depends_on:
      - postgres
    networks:
      - erp_network

  pos-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: pos-service
    container_name: erp_pos_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8004
    depends_on:
      - postgres
    networks:
      - erp_network

  purchasing-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: purchasing-service
    container_name: erp_purchasing_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8005
    depends_on:
      - postgres
    networks:
      - erp_network

  finance-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: finance-service
    container_name: erp_finance_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8006
    depends_on:
      - postgres
    networks:
      - erp_network

  chat-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: chat-service
    container_name: erp_chat_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8007
    depends_on:
      - postgres
    networks:
      - erp_network

  crm-loyalty-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: crm-loyalty-service
    container_name: erp_crm_loyalty_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8008
    depends_on:
      - postgres
    networks:
      - erp_network

  ai-assistant-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: ai-assistant-service
    container_name: erp_ai_assistant_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8009
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      - postgres
    networks:
      - erp_network

  asset-service:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE_NAME: asset-service
    container_name: erp_asset_service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: erp_password
      APP_PORT: 8010
    depends_on:
      - postgres
    networks:
      - erp_network

  # 4. Database PostgreSQL Engine (Auto-Create 10 DBs)
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-all-databases.sh:/docker-entrypoint-initdb.d/init-all-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d auth_db"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - erp_network

  # 5. MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: erp_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - erp_network

  # 6. Apache Kafka Event Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: erp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - erp_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: erp_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - erp_network

  # 7. WAHA WhatsApp HTTP API
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: erp_waha
    restart: always
    environment:
      WAHA_ZIP_LOCAL_STORE: "true"
      WHATSAPP_HOOK_URL: "http://nginx:80/api/v1/waha/webhook"
    ports:
      - "3000:3000"
    networks:
      - erp_network

volumes:
  postgres_data:
  minio_data:

networks:
  erp_network:
    driver: bridge
